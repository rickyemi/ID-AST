[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gram-id-ast-ml"
version = "1.0.0"
description = "Multi-tier ML for digital-microscopy ID/AST: Gram reaction, well growth and MIC calls"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YO (rickyemi)" }]
keywords = ["microbiology", "AST", "MIC", "Gram stain", "digital microscopy", "xgboost", "svm", "transformer"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
